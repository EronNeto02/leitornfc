<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Leitor NFC - BlueBoat</title>

<style>

body{

    font-family:Arial;
    background:#f5f5f5;
    text-align:center;
    margin-top:60px;

}

h1{

    color:#003366;

}

button{

    padding:15px 35px;
    font-size:20px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:#003366;
    color:white;

}

button:hover{

    background:#0055aa;

}

#status{

    margin-top:30px;
    font-size:22px;

}

#uid{

    margin-top:20px;
    font-size:26px;
    color:#0066cc;
    font-weight:bold;

}

#equipamento{

    margin-top:30px;
    width:500px;
    margin-left:auto;
    margin-right:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,.15);

}

#equipamento h2{

    color:#003366;

}

</style>

</head>

<body>

<h1>Leitor NFC</h1>

<button onclick="lerNFC()">
Ler Tag NFC
</button>

<div id="status">
Clique no botão para iniciar.
</div>

<div id="uid">

</div>

<div id="equipamento">

    Aguardando leitura...

</div>

<script>

/////////////////////////////////////////////////////////////////
// BANCO DE DADOS LOCAL
/////////////////////////////////////////////////////////////////

const equipamentos = {

    "53:5d:f5:74:b5:00:01":{

        codigo:"PRD-000001",

        nome:"G16S",

        fabricante:"Parker",

        descricao:"Conexão União de Tubo 16mm"

    },
     "53:57:fc:74:b5:00:01":{

        codigo:"MOG-Mouse-006",

        nome:"Mouse",

        fabricante:"APP-Tech",

        descricao:"Mouse ótico USb Bluethoot"

    },
     "53:f1:ef:74:b5:00:01":{

        codigo:"MOG-PAQ-012",

        nome:"Paquímetro",

        fabricante:"Starret",

        descricao:"Paquímetro Starret 150mm"

    },

    "53:e9:e8:74:b5:00:01":{

        codigo:"MOG-TRENA-002",

        nome:"Trena",

        fabricante:"Starrett",

        descricao:"Trena com trava de 5 metros"

    }

};

/////////////////////////////////////////////////////////////////
// LEITOR NFC
/////////////////////////////////////////////////////////////////

async function lerNFC(){

    if(!("NDEFReader" in window)){

        alert("Este navegador não suporta Web NFC.");

        return;

    }

    try{

        const ndef = new NDEFReader();

        await ndef.scan();

        document.getElementById("status").innerHTML =
        "Aproxime a Tag NFC...";

        ndef.onreading = (event)=>{

            const uid = event.serialNumber.toLowerCase();

            document.getElementById("uid").innerHTML =
            "<strong>UID:</strong><br>"+uid;

            if(equipamentos[uid]){

                const item = equipamentos[uid];

                document.getElementById("status").innerHTML =
                "✅ Equipamento identificado";

                document.getElementById("equipamento").innerHTML =

                "<h2>"+item.nome+"</h2>" +

                "<p><b>Código:</b> "+item.codigo+"</p>" +

                "<p><b>Fabricante:</b> "+item.fabricante+"</p>" +

                "<p><b>Descrição:</b> "+item.descricao+"</p>";

            }

            else{

                document.getElementById("status").innerHTML =
                "❌ Equipamento não cadastrado.";

                document.getElementById("equipamento").innerHTML =

                "<h2>Nenhum cadastro encontrado</h2>" +

                "<p>Cadastre este UID no sistema.</p>";

            }

        };

    }

    catch(error){

        document.getElementById("status").innerHTML = error;

    }

}

</script>

</body>

</html>
