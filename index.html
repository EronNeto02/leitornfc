<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Leitor NFC - UID</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            margin-top:80px;
            background:#f5f5f5;
        }

        h1{
            color:#333;
        }

        button{
            padding:15px 30px;
            font-size:20px;
            cursor:pointer;
        }

        #status{
            margin-top:25px;
            font-size:20px;
        }

        #uid{
            margin-top:20px;
            font-size:30px;
            color:blue;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>Leitor NFC</h1>

<button onclick="lerNFC()">
Ler Tag
</button>

<div id="status">
Aguardando...
</div>

<div id="uid">

</div>

<script>

async function lerNFC(){

    if(!("NDEFReader" in window)){
        alert("Seu navegador não suporta Web NFC.");
        return;
    }

    try{

        const ndef = new NDEFReader();

        await ndef.scan();

        document.getElementById("status").innerHTML =
            "Aproxime a Tag NFC...";

        ndef.onreading = (event)=>{

            document.getElementById("status").innerHTML =
                "Tag encontrada!";

            document.getElementById("uid").innerHTML =
                event.serialNumber;

        };

    }
    catch(error){

        document.getElementById("status").innerHTML =
            error;

    }

}

</script>

</body>

</html>
